# =============================================================================
# DriveMate - P3 assistant configuration (LLM + voice + phone)
# =============================================================================
# Every threshold, limit and list used by assistant/ lives here, never in code
# (DriveMate-PLAN-FINAL.md, section 8: "Pragurile stau în fișierele de configurare").
#
# Secrets (API key, phone numbers, KDE Connect device id) are NOT here: they live
# only in the repo-root `.env` file (see `.env.example`).
#
# Loaded by assistant/config.py -> get_config().
# =============================================================================

# Spoken language of the assistant. Selects assistant/config/texts.<language>.yaml
# and the TTS voices below. Decided after the Friday-night STT/TTS test:
# "ro" (default) or "en" (fallback if Romanian speech recognition fails).
language: ro

# -----------------------------------------------------------------------------
# LLM (plan 4.D / D1, section 6)
# -----------------------------------------------------------------------------
llm:
  # Provider used when LLM_PROVIDER is empty in .env. Only "gemini" is implemented;
  # "offline" forces the fixed fallback texts (no network at all).
  default_provider: gemini
  # Model used when LLM_MODEL is empty in .env. Leave null to require it in .env.
  # Use a fast "Flash" model (NOT a "Pro" model): the plan needs < 2 s to first speech.
  default_model: null
  # Hard deadline for one LLM answer, in seconds (plan C9 / D1: 2.5 s -> fixed text).
  timeout_s: 2.5
  # Maximum number of actions accepted from one LLM answer (plan section 6).
  max_actions: 3
  # Sampling temperature. Low = predictable, short answers (0.4 sometimes made the
  # model stay silent on a direct request; 0.2 is more consistent).
  temperature: 0.2
  # Upper bound for the generated JSON. Answers are tiny (<= 3 short actions).
  max_output_tokens: 400
  # Gemini "thinking" control for the main model (LLM_MODEL). Gemini 3.x models
  # reject thinking_budget (HTTP 400) and some reject level "minimal"; set at most
  # one of them. A rejected value makes every call fail fast with "llm_error" and
  # the fixed fallback texts are used - check the log.
  # Tested 2026-11-21 with the real prompt (paid tier): gemini-3.5-flash-lite with
  # the default (null) timed out or took ~8 s; with level "low" it answered in
  # 0.7-1.6 s, all answers correct.
  thinking_budget: null
  thinking_level: low
  # One retry on a temporary Gemini error (503 = Google overloaded, 429 = rate limit,
  # 500/502/504), inside the SAME timeout_s deadline: only if nothing was spoken yet
  # and at least min_remaining_s is left; otherwise the fixed texts are used as before.
  retry:
    enabled: true
    min_remaining_s: 1.0
  # Model used for that retry (LLM_BACKUP_MODEL in .env overrides it). Overload is
  # usually per model, so a different Flash model often answers at once. Empty or
  # null = retry on the main model.
  # Tested 2026-11-21: gemini-3.1-flash-lite answered in 0.8-1.2 s with its default
  # thinking, the most consistent (the retry only has what is left of timeout_s).
  # Rejected: gemini-2.5-flash (404 NOT_FOUND although listed), gemini-3.5-flash and
  # gemini-3.6-flash (2-3.5 s, too slow for a retry).
  backup_model: gemini-3.1-flash-lite
  # Thinking settings for the backup model only (same rules as above). null = the
  # model's default, which is fast for 3.1-flash-lite. For a 2.5 model use
  # thinking_budget 0 instead.
  backup_thinking_budget: null
  backup_thinking_level: null

# -----------------------------------------------------------------------------
# Speaking rules (plan 4.D "Regula de formă", section 5)
# -----------------------------------------------------------------------------
speech:
  # Maximum words in anything said to the driver (speak.text / ask.question), all
  # sentences of one text counted together. Raised from 15 (plan 4.D) to 30 on
  # 2026-11-21: 15 rejected normal conversational answers. The LLM prompt gets the
  # same number ({max_words} in prompts/system.md).
  max_words_to_driver: 30
  # Maximum words for anything said to a passenger (never stricter than the driver's).
  max_words_to_passenger: 30
  # After a STATEMENT that answers the driver (driver_speech, no question in the answer),
  # the assistant adds "Te mai ajut cu ceva?" (texts: fallback.follow_up) so the dialog
  # window opens and the driver can go on without the wake word. "Nu" / "nimic" / "gata"
  # -> silence and the browser stops listening without the wake word. Every time for now.
  follow_up:
    enabled: true
  # Dialog window after a question, in seconds: voice is accepted without the
  # assistant's name while it is open (plan E1). Core opens it on speak_done.
  dialog_window_s: 6
  # Seconds a question with pending actions ("Trimit?", "Bine?", KSS, quiz) waits for an
  # answer before the pending actions are cancelled silently (assistant/dialog.py).
  # Longer than the dialog window because the question itself must be spoken first.
  pending_timeout_s: 20

# -----------------------------------------------------------------------------
# Policies (assistant/policies.py; plan "cel mult o intervenție proactivă la 30 s")
# -----------------------------------------------------------------------------
policies:
  # Minimum seconds between two PROACTIVE interventions (ones the driver did not ask for).
  proactive_min_interval_s: 30
  # Safety levels at which the LLM is vetoed (plan C8: LLM silent at P0-P2).
  llm_vetoed_levels: [P0, P1, P2]
  # Event types that are proactive (rate-limited, blocked while muted / during conversation).
  # (media_declined is NOT proactive: it answers the driver's "no" to the music.)
  proactive_events: [cause_detected, fatigue_high, disengagement_high]
  # Proactive events that are still allowed during an in-car conversation (plan G2:
  # "cu excepția situațiilor de siguranță sau cauză").
  allowed_during_conversation: [cause_detected, fatigue_high]
  # Event types that are always delivered, even while the assistant is muted after
  # a refusal (plan section 5, rule 8: messages from contacts keep being delivered).
  allowed_while_muted: [message_received, safe_contact_reply, driver_speech,
                        message_reply_dictated, stop_reached, trip_start, alert_explain]

# -----------------------------------------------------------------------------
# Short memory (assistant/memory.py; plan D1 "memorie scurtă")
# -----------------------------------------------------------------------------
memory:
  # How many recent utterances (driver + assistant) are sent to the LLM.
  turns: 3

# -----------------------------------------------------------------------------
# Text-to-speech (assistant/tts.py, integrations/audio_clips.py; plan E1, E7)
# -----------------------------------------------------------------------------
tts:
  voices:
    # Male voice on purpose: the browser's offline fallback on Windows is also male
    # ("Microsoft Andrei"), so the voice does not switch between sentences when one
    # edge-tts sentence fails. After changing it, regenerate the clips:
    # .venv/Scripts/python integrations/audio_clips.py --force
    ro: ro-RO-EmilNeural       # alternative: ro-RO-AlinaNeural (female)
    en: en-US-AvaMultilingualNeural
  rate: "+5%"                  # slightly faster than default, keeps sentences short
  alarm_rate: "+15%"           # alarm clips are urgent
  # How many synthesized sentences are kept in memory by the /tts router.
  cache_size: 256

# Pre-generated clips (integrations/audio_clips.py -> dashboard/public/sounds/clips/).
# Names are used until profiles/<name>/profile.json exists (P4); then profiles win.
clips:
  output_dir: dashboard/public/sounds/clips
  # People that get a personal alarm clip ("ANDREI!") and passenger instructions.
  names: [Andrei, Maria, Ioana, Mihai]
  # Trusted / emergency contacts that get "Îi dau de veste lui {contact}."
  contact_names: [Mihai]

# -----------------------------------------------------------------------------
# Music recommendation (assistant/music.py; plan D8)
# -----------------------------------------------------------------------------
music:
  catalog: assistant/data/media_catalog.json
  media_dir: assistant/data/media        # mp3 files, gitignored, shared between us
  # Minimum energy (1-5) for a track proposed against disengagement (D).
  min_energy_for_disengagement: 4
  # Genres used when the driver profile has no music preferences.
  default_genres: [pop, rock, electronic]
  # Playback volume (0-1): normal, and when the front passenger is asleep (plan G3).
  volume_normal: 0.6
  volume_passenger_asleep: 0.25
  # Spoken volume commands ("mai încet", "mai tare", "la jumătate", "volumul la 30"), handled without the
  # LLM as set_preference {key: volume}: step per "mai încet / mai tare", "foarte" doubles it, and the
  # quietest level a command may set (0 would look like a broken player; "oprește" stops the music).
  volume_step: 0.2
  volume_min: 0.05
  # Volume changes are executed at once, without "Bine?": the driver asked explicitly and it is undone
  # just as easily (plan section 6 asks a confirmation for set_preference in general).
  volume_without_confirmation: true
  # How many candidate tracks are shown to the LLM to choose from.
  candidates_for_llm: 5
  # Catalog genre that marks spoken podcasts (offered with the quiz when music is
  # refused, plan D8). With no such track in the catalog only the quiz is offered.
  podcast_genre: podcast

# -----------------------------------------------------------------------------
# YouTube music / podcasts on request (assistant/media_search.py; S feature, docs/assistant.md 6.1)
# "dă-mi ceva metal energic" -> search -> "Am găsit: A, B sau C. Care?" -> audio stream via core.
# Search: YouTube Data API v3 when YOUTUBE_API_KEY is in .env, else yt-dlp (no key, slower).
# Playback: yt-dlp extracts the audio stream; assistant/router.py proxies it at /media/yt/<id>.m4a
# (same player as the mp3 catalog: no ads, ducking and alarm stop unchanged).
# -----------------------------------------------------------------------------
youtube:
  enabled: true
  # How many results are fetched, and offered in one question (1 when driving fast, see below).
  results_fetched: 6
  results_offered: 3
  # Offer ONE option ("Pun X?") instead of three when speed >= this or risk >= single_option_risk:
  # a list of three titles is too much to keep in mind at highway speed.
  single_option_speed_kmh: 90
  single_option_risk: 1
  # Words per spoken option: start here, shrink until the question fits speech.max_words_to_driver.
  option_max_words: 4
  option_min_words: 2
  # Seconds allowed for the search itself (the LLM deadline is separate).
  search_timeout_s: 8
  # Duration filters in minutes (live streams are always skipped).
  music_max_min: 75
  podcast_min_min: 5
  # YouTube Data API parameters.
  region: RO
  relevance_language: ro
  # With a child on board: SafeSearch strict, which only the Data API offers. Without a key the
  # assistant then plays only kid_safe tracks from the local catalog.
  require_api_with_child: true
  # Audio proxy: upstream requests in chunks of this size (large single ranges get throttled / 403).
  proxy_chunk_mb: 4
  # Resolved stream URLs are reused for this long (YouTube URLs expire after a few hours).
  stream_cache_min: 120
  # Optional JavaScript runtime for yt-dlp ("node" / "deno"), only if extraction starts failing.
  js_runtime: null
  # Words removed from titles before they are spoken (whole words / phrases, case-insensitive).
  title_noise: [official music video, official video, official audio, official lyric video, music video,
                lyric video, lyrics, lyric, videoclip oficial, audio oficial, visualizer, remastered,
                remaster, full hd, hd, hq, 4k, 8k, explicit]
  # Words that do not count as a specific wish in "da, te rog" (vs. "da, ceva metal").
  yes_fillers: [da, ok, okay, bine, sigur, te, rog, frumos, pune, puneti, dami, da-mi, mi, ceva, acum, hai,
                vreau, desigur, normal, chiar, poftim, foarte, multumesc, merci, "yes", please]

# -----------------------------------------------------------------------------
# Quiz (assistant/quiz.py; plan D8 "Refuz -> quiz sau podcast")
# -----------------------------------------------------------------------------
quiz:
  questions_file: assistant/data/quiz.json
  # Questions per quiz.
  length: 3

# -----------------------------------------------------------------------------
# KSS answer (plan D3: "Cât de obosit ești, 1-9?" -> pauză concretă)
# -----------------------------------------------------------------------------
kss:
  # KSS >= high: the assistant announces a break (P2's rule then picks the stop).
  high: 7
  # mid <= KSS < high: keep the driver talking; below mid: just acknowledge.
  mid: 5

# -----------------------------------------------------------------------------
# Reminders (plan K1 / D9)
# -----------------------------------------------------------------------------
reminders:
  # Valid POI categories for create_reminder. TEMPORARY copy of the categories in
  # simulator/stops.json (P4); when that file exists, its categories are used instead.
  poi_categories: [fuel, cafe, pharmacy, supermarket, auto_parts]
  trigger_types: [stop_at_category]

# -----------------------------------------------------------------------------
# Preferences the driver can change by voice (set_preference, plan section 6)
# -----------------------------------------------------------------------------
preferences:
  # key: [min, max] for numbers, or a list of allowed values.
  volume: [0.0, 1.0]
  talkativeness: [low, normal, high]
  music_genre: [pop, rock, electronic, jazz, classical, lofi, acoustic, dance, hiphop, kids]

# -----------------------------------------------------------------------------
# Phone bridge (integrations/phone_bridge.py; plan F1, F3, F8)
# -----------------------------------------------------------------------------
phone:
  # Android app names (as reported by KDE Connect) -> app code used in the contract.
  app_whitelist:
    WhatsApp: whatsapp
    Messages: sms
    Mesaje: sms
    "Google Messages": sms
    "Samsung Messages": sms
  # Senders accepted from whitelisted apps. ["*"] = everyone.
  contact_whitelist: ["*"]
  # Seconds between two battery / connection status reports to core.
  status_interval_s: 30
  # Seconds before retrying when core or the phone is unreachable.
  reconnect_s: 3
