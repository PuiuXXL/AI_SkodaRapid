# Tool configuration only (no packaging). Scoped to P1 perception for now.
# Other modules can add their paths to `include` / `files` when they adopt ruff / mypy.

[tool.ruff]
target-version = "py311"
line-length = 120
include = [
    "perception/**/*.py",
    "tests/perception/**/*.py",
    "tests/contract/**/*.py",       # perception <-> core golden messages (P1 + P2 boundary)
    "tests/integration/**/*.py",    # perception.main <-> core.main end to end
    "scripts/benchmark.py",
    "scripts/preview.py",
    "scripts/label_session.py",
    "scripts/live_driver.py",
    "scripts/eval_eyes.py",
    "scripts/enroll_face.py",
    "scripts/calibrate.py",
    "scripts/eval_zones.py",
    "scripts/eval_interaction.py",
    "scripts/diag_eyes.py",
    "scripts/tune_one_euro.py",
    "scripts/ws_sink.py",
    "scripts/camera_probe.py",
    "scripts/eval_passenger.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["perception"]

[tool.pytest.ini_options]
# plain `pytest` = the fast suite; `pytest -m slow` = the slow tests only; `pytest -m "slow or not slow"` = everything
addopts = '-m "not slow"'
markers = [
    "slow: real models, recorded data, camera, spawned processes or > 2 s (skipped by default; run with -m slow)",
]

[tool.mypy]
python_version = "3.11"
files = ["perception", "tests/perception", "scripts/benchmark.py", "scripts/preview.py", "scripts/label_session.py",
         "scripts/live_driver.py", "scripts/eval_eyes.py", "scripts/calibrate.py", "scripts/eval_zones.py",
         "scripts/enroll_face.py", "scripts/eval_interaction.py", "scripts/diag_eyes.py", "scripts/tune_one_euro.py",
         "scripts/ws_sink.py", "scripts/camera_probe.py", "scripts/eval_passenger.py"]
strict = true
explicit_package_bases = true  # tests/ has no __init__.py: name modules from the repo root (tests.perception.*)
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*", "ultralytics", "ultralytics.*", "onnxruntime", "onnxruntime.*", "openvino", "openvino.*", "onnx", "onnx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
