name: perception

on:
  push:
    paths:
      - "perception/**"
      - "shared/**"                     # P2's contract: perception validates every frame against it
      - "tests/perception/**"
      - "tests/contract/**"             # golden P1 frames (frame shape)
      - "scripts/**"                    # ruff / mypy check the P1 scripts (pyproject include / files)
      - "requirements/p1-*.txt"
      - "pyproject.toml"
      - ".github/workflows/perception.yml"
  pull_request:
    paths:
      - "perception/**"
      - "shared/**"
      - "tests/perception/**"
      - "tests/contract/**"
      - "scripts/**"
      - "requirements/p1-*.txt"
      - "pyproject.toml"
      - ".github/workflows/perception.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perception-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # P1 decision 2026-11-21 (code still targets 3.11: pyproject ruff / mypy)
          cache: pip
          cache-dependency-path: |
            requirements/p1-perception.txt
            requirements/p1-dev.txt

      - name: Install MediaPipe system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1

      - name: Install dependencies (CPU-only torch, no models, no camera)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/p1-perception.txt -r requirements/p1-dev.txt pytest-cov

      - name: Shell scripts syntax
        run: for f in scripts/camera_setup.sh scripts/download_models.sh; do bash -n "$f"; done

      - name: Ruff
        run: ruff check

      - name: Mypy
        run: mypy

      - name: Pytest + coverage (tests needing models or a camera are skipped)
        run: >
          python -m pytest tests/perception tests/contract -m "not models and not camera" -q
          --cov=perception --cov-report=term-missing:skip-covered --cov-report=xml:coverage-perception.xml
          --cov-fail-under=83

      - name: Coverage summary
        if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-perception
          path: coverage-perception.xml
          if-no-files-found: ignore
