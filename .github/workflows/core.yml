name: core

# P2: core server, safety rules, scoring and the shared contract. Also runs the core side of the perception
# contract tests (tests/contract/test_core_reads_p1.py: P1's golden messages must parse and reach the engine).

on:
  push:
    paths:
      - "core/**"
      - "shared/**"
      - "simulator/**"
      - "integrations/**"
      - "assistant/**"
      - "tests/core/**"
      - "tests/simulator/**"
      - "tests/contract/**"
      - "scripts/fake_perception.py"
      - "scripts/core_command.py"
      - "requirements/p2-core.txt"
      - "requirements/p3-assistant.txt"
      - "pyproject.toml"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "shared/**"
      - "simulator/**"
      - "integrations/**"
      - "assistant/**"
      - "tests/core/**"
      - "tests/simulator/**"
      - "tests/contract/**"
      - "scripts/fake_perception.py"
      - "scripts/core_command.py"
      - "requirements/p2-core.txt"
      - "requirements/p3-assistant.txt"
      - "pyproject.toml"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/p2-core.txt
            requirements/p3-assistant.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/p2-core.txt -r requirements/p3-assistant.txt pytest-cov ruff
          pip check

      - name: Verify core-assistant runtime imports
        run: python -c "from core.main import create_app; from assistant.tts import speak_message; from assistant.client import AssistantClient"

      # Blocking: only what breaks at run time (syntax errors, undefined names). The style rules are reported below.
      - name: Ruff (runtime errors)
        run: >
          ruff check core shared integrations simulator tests/core tests/simulator tests/contract --isolated --target-version py311
          --select E9,F63,F7,F821

      - name: Ruff (full report, not blocking)
        continue-on-error: true
        run: >
          ruff check core shared integrations simulator --isolated --line-length 120 --target-version py311
          --select E,F,W,I,UP,B,SIM,RUF --statistics

      - name: Pytest + coverage
        run: >
          python -m pytest tests/core tests/simulator tests/contract/test_core_reads_p1.py tests/contract/test_dashboard_route.py -q
          --cov=core --cov=shared --cov=simulator --cov-report=term-missing:skip-covered --cov-report=xml:coverage-core.xml
          --cov-fail-under=93

      - name: Coverage summary
        if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-core
          path: coverage-core.xml
          if-no-files-found: ignore
