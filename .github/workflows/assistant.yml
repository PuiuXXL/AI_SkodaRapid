name: assistant

# P3: LLM dialog, voice, media and the phone bridge. Tests run offline (synthetic media catalog, no API key).

on:
  push:
    paths:
      - "assistant/**"
      - "shared/**"
      - "integrations/**"
      - "tests/assistant/**"
      - "requirements/p3-assistant.txt"
      - "pyproject.toml"
      - ".github/workflows/assistant.yml"
  pull_request:
    paths:
      - "assistant/**"
      - "shared/**"
      - "integrations/**"
      - "tests/assistant/**"
      - "requirements/p3-assistant.txt"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/p3-assistant.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/p3-assistant.txt pytest-cov ruff

      # Blocking: syntax errors and undefined names only (F822 is left out: assistant/contract.py fills __all__
      # dynamically from shared/contracts.py). The style rules are reported below.
      - name: Ruff (runtime errors)
        run: >
          ruff check assistant integrations tests/assistant --isolated --target-version py311
          --select E9,F63,F7,F821

      - name: Ruff (full report, not blocking)
        continue-on-error: true
        run: >
          ruff check assistant integrations --isolated --line-length 120 --target-version py311
          --select E,F,W,I,UP,B,SIM,RUF --statistics

      - name: Pytest + coverage
        run: >
          python -m pytest tests/assistant -q
          --cov=assistant --cov-report=term-missing:skip-covered --cov-report=xml:coverage-assistant.xml
          --cov-fail-under=70

      - name: Coverage summary
        if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-assistant
          path: coverage-assistant.xml
          if-no-files-found: ignore
