# PENDING keys for perception/config/perception.yaml (output session, docs/notes/output.md "De integrat").
# perception/config.py rejects unknown keys, so these live here until the integration moves them into perception.yaml
# (+ the matching fields in perception/config.py). Loaded and validated strictly by perception/main.py (no defaults in
# code: every key is required).

output:
  result_max_age_ms: 1000      # a camera's newest result older than this = no data from that camera: its block keeps
                               # the contract defaults and perf.cameras.<cam>.available = false. Above the slowest
                               # degraded passenger rate (2.5 Hz -> 400 ms between results) plus processing.
  mjpeg_host: 0.0.0.0          # MJPEG bind address (port: output.mjpeg_port)

workers:
  modules:                     # extra PipelineModule classes ("package.module:Class"), appended after the built-in
    driver: []                 # modules of that camera (perception/worker.py). Constructed as Class(ctx, extractor).
    passenger: []
