# P1 perception thresholds and settings. Validated by perception/config.py (unknown keys are rejected).
# Starting values: tune them on the real setup (Sunday, in the venue). Reasons: docs/perception.md.
# Safety thresholds (when an alarm sounds, microsleep) belong to P2 in core/config/thresholds.yaml, NOT here.

cameras:
  # Both USB webcams run on ONE laptop: with MJPG requested at open they share a root hub (probe 2026-11-21:
  # C615 + LifeCam at 720p, 30.3 / 29.5 fps at once; docs/benchmark/cameras-<host>.md, scripts/camera_probe.py).
  # Devices by USB id (usb:<vid>:<pid>[:<serial>][@<port>]): the role survives re-plugging and index shifts; two
  # cameras of the same model need @<port> (camera_probe.py prints it).
  driver:                      # USB webcam (Logi C615, 1080p max), facing the driver only
    enabled: true
    device: "usb:046d:082c"    # Logi C615 (an OpenCV index, path or URL also works)
    device_name: "C615"        # no usb match -> unique friendly-name substring (null = off)
    backend: auto              # auto | dshow | msmf | v4l2 | any   (Windows: dshow opens MJPG reliably)
    width: 1280                # 720p30 (P1 decision 2026-11-21, was 1080p): no decode/resize cost, 30 fps on both
    height: 720
    fps: 30
    fourcc: MJPG               # compressed USB stream -> both cameras at 30 fps on one root hub
    process_width: null        # processed as captured (720p = the size every pixel threshold was tuned at)
    buffer_size: 1             # keep only the latest frame
    reconnect_s: 1.0           # wait between reconnect attempts
    max_read_failures: 15      # consecutive failed reads (~0.5 s at 30 fps) -> reopen the camera
    controls:                  # null = leave as is. Why: docs/perception.md §2.1
      # LAPTOP PROFILE (no lamp): auto exposure + auto white balance, set EXPLICITLY to true because the
      # camera driver remembers manual values after the app exits (a 16 ms manual exposure left the image at
      # mean luma 36/255). VENUE PROFILE (our lamp on the driver): auto_exposure: false, exposure_ms: 16,
      # auto_white_balance: false, white_balance_k: 4600.
      power_line_hz: 50        # EU mains: removes 100 Hz flicker banding under venue lights (Linux only)
      autofocus: false         # no focus hunting when the head moves
      focus: null              # set after checking `camera_setup.sh driver --list` on the real camera
      auto_exposure: true      # venue with lamp: false (auto-exposure "pumping" changes EAR between frames)
      exposure_ms: null        # venue with lamp: 16 (<= 1/fps; limits motion blur)
      gain: null
      auto_white_balance: true # venue with lamp: false
      white_balance_k: null    # venue with lamp: 4600
  passenger:                   # USB webcam (Microsoft LifeCam HD-6000, 720p max), facing the front-right seat only
    enabled: true
    device: "usb:045e:076f"    # LifeCam HD-6000
    device_name: "LifeCam"
    process_width: null        # LifeCam HD-6000: 720p is its hardware maximum, processed as captured
    backend: auto
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    buffer_size: 1
    reconnect_s: 1.0
    max_read_failures: 15
    controls:                  # auto modes: the passenger rules (presence, asleep) need no fixed exposure
      power_line_hz: null
      autofocus: null
      focus: null
      auto_exposure: null
      exposure_ms: null
      gain: null
      auto_white_balance: null
      white_balance_k: null
  # Selection order per camera: usb selector -> device_name -> (only with dev_fallback) a device no camera claims,
  # preferring a name containing fallback_name; the driver has priority. A camera still not found is reported
  # camera_unavailable (no restart loop). The start-up log prints the device table and the assignment.
  dev_fallback: false          # development only (laptop without the USB cams); the frame says camera_fallback
  fallback_name: "Integrated"  # DirectShow name of the laptop camera ("Integrated Camera")

models:
  dir: perception/models       # relative to the repo root; gitignored, filled by scripts/download_models.sh
  face_landmarker: face_landmarker.task
  gesture_recognizer: gesture_recognizer.task
  gaze: mobileone_s0_gaze.onnx # MobileGaze MobileOne-S0 (yakhyo/gaze-estimation), check the weights' licence
  yunet: face_detection_yunet_2023mar.onnx
  sface: face_recognition_sface_2021dec.onnx
  phone_device: auto           # auto | cpu | gpu   (auto = gpu if CUDA is available)
  phone_cpu: { weights: yolo26s.pt, imgsz: 640 }  # live comparison 2026-11-21 (docs/eval/phone-compare-*.md):
                               # detection ear/chest/lap/side 58/100/54/100 % vs 3/99/0/76 % for yolo26n@416
  phone_gpu: { weights: yolo26s.pt, imgsz: 640 }
  pose: yolo26n-pose.pt        # only for rear_seat (S feature)
  onnx_providers:              # tried in order, the first available wins (YOLO26s on the GPU)
    - CUDAExecutionProvider
    - OpenVINOExecutionProvider
    - CPUExecutionProvider
  eye_state: open_closed_eye.onnx  # open-closed-eye-0001, Intel OMZ, Apache-2.0 (eye-crop CNN, ~0.0014 GFLOPs)
  gaze_providers:              # MobileGaze is small: CUDA adds jitter (p95 15.4 vs 8.2 ms, docs/benchmark/)
    - OpenVINOExecutionProvider
    - CPUExecutionProvider
  onnx_threads: 4              # ORT intra-op threads per session (0 = all cores); two camera processes share the CPU
                               # (also applied to native OpenVINO now: it used every core)
  phone_threads: 2             # yolo26s@640 in its own thread with 2 cores: the face keeps the rest (live 2026-11-21)

face:                          # MediaPipe Face Landmarker, rules R-FL1..R-FL5 in docs/perception.md
  num_faces: 1                 # R-FL1: one face per camera (internal tracking/smoothing needs it)
  min_detection_conf: 0.5      # R-FL2
  min_presence_conf: 0.5       # R-FL2
  min_tracking_conf: 0.6       # R-FL2
  min_face_width_px: 250       # R-FL3: narrower face -> face_too_small + reduced confidence

rates:
  driver_face_every_frame: true  # the driver face is never degraded
  passenger_face_hz: 15        # half the capture rate: at 30 Hz the CPU saturated with two faces and the degrade
                               # ladder dropped the passenger to 3.6 Hz and the driver to 17 fps (live 2026-11-21)
  gaze_hz: 15
  phone_hz: 5
  pose_hz: 2                   # rear_seat confirmation only
  identity_recheck_s: 10
  perf_window: 120             # samples kept per model for p50/p95
  degrade_e2e_p95_ms: 150      # above this: lower the passenger rate first, then YOLO (driver face: never)
  degrade_step: 0.5            # each step halves the rate being degraded
  degrade_min_passenger_face_hz: 5.0   # below this the passenger card visibly lags (2.5 looked frozen live)
  degrade_min_phone_hz: 1.25
  degrade_recover_ratio: 0.7   # step back up when p95 < 0.7 x the limit
  degrade_hold_s: 3.0          # at least this long between two steps (no oscillation)

eyes:                          # docs/perception.md §3.2; values from docs/eval/ (diag of 2026-11-21)
  # global reference: calibration, or the p90 of the first seconds. Only a FLOOR for the local reference
  # (the open-eye EAR drifts with head pitch: 0.30 at the start -> 0.24 a minute later in the diag session).
  baseline_window_s: 10
  baseline_percentile: 90
  baseline_min_s: 2.0          # provisional baseline usable after this much valid face time (state UNKNOWN before)
  local_ref_window_s: 4.0      # local reference = p90 of EAR over the last seconds (blinks < 10 % of frames: ignored)
  local_ref_percentile: 90
  local_ref_min_s: 1.0         # below this much open-eye history, the global reference is used
  ref_floor_ratio: 0.60        # local reference never below 0.6 x global (does not collapse with drowsy lids)
  # blink shape, as ratios of the local reference
  drop_ratio: 0.70             # closing: ratio below this ... (0.65 missed shallow blinks: min 0.58-0.63)
  reopen_ratio: 0.80           # ... until it comes back above this
  fall_max_ms: 150             # fast fall (blink / real closure): from the local peak to drop_ratio
  fall_window_s: 1.0           # the local peak = max ratio over this window before the fall
  min_fall_depth: 0.10         # the peak must be at least this far above the threshold (else: a slow drift)
  slow_close_ratio: 0.47       # a SLOW fall counts only below this (2 s closures: 0.42-0.47; a hard squint
                               # hovered at 0.48-0.51). Tuned on ONE session: re-check on every new one
  min_state_frames: 2          # frames below drop_ratio before CLOSED is reported (closed_ms starts at the drop)
  reopen_min_frames: 2         # two tiers: a closure LONGER than blink_max_ms ends only after this many open frames in a
                               # row (one bright frame no longer resets closed_ms); a blink ends at the first open frame
  closure_gap_max_ms: 200      # face lost / eyes unreliable this long inside a LONG closure: the closure goes on
  blink_max_ms: 400            # longer than this = closure (separate state, reopen hysteresis), shorter = blink
  plateau_check_ms: 300        # from here on, CLOSED needs ratio < squint band low AND eyeBlink >= blendshape_closed
  blendshape_closed: 0.45      # eyeBlink needed to accept a SLOW fall (drowsy lids); 2 s closures reach ~0.5,
                               # smiles 0.31-0.46, speech 0.26-0.36 in the diag session
  blendshape_strong: 0.65      # eyeBlink alone confirms closed (never reached in the diag session: max 0.59)
  # bilateral rule + gaze conditioning
  unilateral_width_ratio: 0.70 # eye narrower than this x the other (head turned) -> only the wider eye decides
  look_down_threshold: 0.50    # eyeLookDown (mean L/R) at or above this -> relaxed threshold
  pitch_down_deg: 15           # head pitch at or below -this -> relaxed (looking at the lap: -27..-32 deg)
  pitch_up_deg: 20             # head pitch at or above this -> relaxed (EAR drops when the head tilts back)
  drop_ratio_relaxed: 0.45     # closing threshold while relaxed (stricter: the eyes must really close)
  head_motion_window_s: 0.30   # no closure may START while pitch or yaw moved more than head_motion_deg in this
  head_motion_deg: 6.0         # window (the lids follow the head when looking down / at a mirror)
  # R-FL4: squinting / smiling is not closed: ratio inside this band with eyeBlink < blendshape_closed (lids
  # lowered, not meeting). eyeSquint is NOT used: 0.49 at rest and 0.71 with the eyes squeezed shut (diag session).
  squint_ear_band: [0.50, 0.70] # [closed-plateau floor, drop_ratio]: lowered lids that would otherwise be closing
  squint_veto: 0.60            # R-FL4: eyeSquint >= this with the ratio in the band = squint, not closed (rest 0.49,
                               # squeezed shut 0.71 but those lids sit below the band). Start value: tune in B3
  # PERCLOS P80 (FHWA / Dinges): fraction of time with the eyes >= 80 % closed
  closed_level_default: 0.40   # ratio of a fully closed eye until measured (median of the last blink minima)
  perclos_closure: 0.80
  perclos_window_s: 60
  min_eye_width_px: 18         # eye corner distance below this -> that eye is unreliable
  cnn:                         # second opinion from the pixels for what EAR cannot separate (hard squint vs closed)
    enabled: false             # OFF after the live test of 2026-11-21 (docs/eval/eyes-laptop-closures-2026-11-21.md):
                               # in one session class "open" was ~1.0 also for shut eyes (EAR 0.06), so its veto hid
                               # 4/4 real closures; with it off they are 4/4 detected. A veto that can hide a closure
                               # is a safety risk; the code stays for a model validated on our cameras
    crop_scale: 1.6            # crop side = 1.6 x eye-corner distance (the model was trained on loose eye crops)
    open_max: 0.30             # p(closed) < 0.30 = clearly open -> a closure plateau is a squint (veto). Live
                               # 2026-11-21 (C615, docs/eval/eyes-laptop-cnn-2026-11-21.md): wide-open eyes 0.00-0.06,
                               # shut eyes 0.99-1.00, so the veto never blocks a real closure
    closed_min: 1.0            # confirmation OFF: hard squints and big smiles read 0.6-0.97 (a 32 px crop of a nearly
                               # shut eye looks closed), so "confirmed closed" made squints worse (false closures 3 -> 2)

yawn:
  jaw_open_threshold: 0.50     # jawOpen blendshape
  min_duration_s: 1.5

speaking:
  window_s: 1.0
  lip_std_threshold: 0.003     # std of inner-lip gap (13-14) / face height (10-152) over the window. Diag session:
                               # rest p90 0.0007, reading p50 0.0087 (0.008 caught 3/5 sentences, 0.003 caught 5/5)
  reversal_step: 0.003         # smallest gap change counted as a lip movement (fraction of face height)
  min_reversals: 2             # direction changes of the gap per window: speech oscillates, a yawn does not
  hold_ms: 800                 # speaking stays true this long after the last oscillating window (pauses)

head:
  nod:                         # fatigue head drop (with eyes closing)
    pitch_drop_deg: 15
    window_s: 3.0              # a drowsy nod falls slowly (18 deg in 2.5 s): 1.5 s saw only 11 deg (nod 1/5 live)
    closed_recent_s: 2.0       # a closure > blink_max_ms within this long arms the nod: with the head down the shut
                               # lids often read SQUINT (eval 2026-11-21); only a confirmed reopen disarms it
    max_gap_s: 0.5             # face lost this long keeps the pitch history (the falling head leaves the tracker)
    hold_s: 1.0                # a detected nod is reported this long, frames without a face included
  answer:                      # AS8 yes / no, only while the dialog window is open (driver_cam/head_answer.py)
    min_reversals: 2           # zero crossings of the detrended angle within window_s
    window_s: 1.2
    min_amplitude_deg: 4       # peak-to-peak; Schmitt trigger at +- half of it. 6 missed a normal 5 deg nod (0 live
                               # answers 2026-11-21); 4 keeps mirror glance / lap look / talking bob silent (tests)
    slow_tau_s: 1.0            # slow mean (EMA time constant) subtracted: a step / slow drop never crosses zero
    dominance_ratio: 1.5       # both axes oscillating: the answer axis needs 1.5 x the RMS of the other
    max_closed_ms: 400         # eyes closed longer than this reset the count (a blink does not; a fatigue nod does)
    answer_hold_s: 1.5         # a detected answer is reported this long, then counting restarts
    max_gap_s: 0.25            # no angles for longer (face lost, implausible pose) -> state reset
  plausible_deg:               # beyond these the landmarks are garbage (near-profile face: roll 80, yaw -23 while
    yaw: 70                    # the head was turned +50 left, diag 2026-11-21) -> head angles reported as unknown
    pitch: 50
    roll: 45

gaze:                          # docs/perception.md §3.4. Starting values: tuned with scripts/eval_zones.py --sweep
  zones: [road, mirror_left, mirror_right, mirror_rear, cluster, infotainment, lap, passenger]
  crop_expand: 1.0             # MobileGaze crop = landmark face box x this (yakhyo/gaze-estimation: detector box, 1.0)
  max_age_ms: 250              # MobileGaze runs at rates.gaze_hz; an older result is not used (zone -> unknown)
  k: 5                         # distance-weighted kNN (1/d)
  feature_weights:             # applied to the z-scored groups: head yaw/pitch (2), MobileGaze yaw/pitch (2),
    head: 2.0                  # eyeLook* blendshapes (8), iris offset x/y (2). Head 2.0 = 57 % of the distance (was
                               # 25 %: the eyes decided alone and flickered); blocked LOO on the andrei calibration
                               # 2026-11-21: 1.0 -> 53.9 %, 2.0 -> 55.7 %, head only 48.0 % (eyes-only glances need eyes)
    gaze: 1.0
    eye_look: 0.5              # 8 correlated features: half weight so they do not outvote head + gaze
    iris: 1.0
  std_floor:                   # z-score std floor per group, in feature units (deg / blendshape / eye widths)
    head: 1.0
    gaze: 1.0
    eye_look: 0.02
    iris: 0.01
  reject_factor: 1.5           # tau = p95 of the blocked-LOO kNN distances x this; mean distance > tau -> unknown
  loo_exclude_s: 0.5           # blocked LOO: same-segment calibration samples closer than this in time are left out
  min_conf: 0.6                # vote share below this -> unknown
  zone_min_frames: 5           # a new zone is accepted after this many frames (~170 ms at 30 fps; 3 flickered
                               # 61 times / min live on 2026-11-21)
  rear_seat:                   # AS13 (switch demo.rear_seat): face lost right after a growing right turn -> rear_seat
    min_yaw_deg: 35            # |yaw| towards the passenger side on the last face frames (start value, tune in B3)
    min_rise_deg: 10           # ... still growing by this much over rising_s (a turn, not a held pose)
    rising_s: 0.6
    max_gap_s: 0.3             # the last face frame must be this recent when the face goes
    max_s: 3.0                 # plan: rear_seat for at most 3 s
    right_sign: -1             # raw yaw sign when turning right (calibration: passenger / mirror_right yaw < 0)
  unknown_hold_s: 0.6         # a classifier "unknown" keeps the last zone this long (live: 24 % unknown in short bursts)
  away_margin_deg: 15          # rejected AND head beyond the calibrated range by this much -> away (off-road)
  on_road_zones: [road]
  mirror_zones: [mirror_left, mirror_right, mirror_rear]
  mirror_glance_max_ms: 2000   # a mirror glance is driving; it counts as off-road only past this (from its start)
  vats_max_glance_s: 2.0       # off-road glances shorter than this count for VATS
  window_s: 60                 # VATS and entropy window
  default_profile: null        # profiles/<name>/calibration.json loaded at start (null: none until `calibrate`)
  calibration:
    s_per_zone: 2.0            # per zone and per mode
    modes: [owl, lizard]       # head turned / eyes only
    road_factor: 3             # road gets 3x the data (it is where the driver looks most)
    discard_s: 0.3             # dropped after every prompt (reaction time)
    owl_min_head_deg: 10       # OWL step: head (yaw, pitch) closer than this to the road -> warning "turn the head"
                               # (the 17:12 calibration: 5.5-8 deg for 5 zones, so the eyes decided alone)
    transition_s: 1.5          # "back to the road" between zones, not recorded
    min_samples_per_zone: 15
    quick_zones: [road, mirror_left, mirror_right, mirror_rear]  # quick recalibration (~15 s)
    quick_s_per_zone: 1.2         # (1.2 - discard) x 30 fps = 27 samples per step
    quick_transition_s: 0.8      # quick total: road 3.6 + mirrors 6 x 1.2 + 6 transitions x 0.8 = ~15.6 s

phone:
  class_id: 67                 # COCO "cell phone"
  conf_min: 0.48               # yolo26s@640: lowest threshold with zero false frames (no phone 0, wallet max 0.46)
  vote_window: 5               # last N YOLO runs
  vote_min: 3                  # seen in at least this many -> in use
  near_face_ratio: 1.2         # phone centre within ratio * face width of the face centre -> near_face / call
  hand_radius_ratio: 0.6       # palm / wrist within 0.6 x face width of the box -> phone in that hand (start)
  foreign_dx_ratio: 1.5        # passenger side, > 1.5 x face width from the face centre, not near the face -> not
                               # the driver's phone: it does not vote (scene 4) (start)
  passenger_side: right        # the passenger's side in the DRIVER's terms (left-hand-drive car)
  mirrored: false              # the camera image is not mirrored: image right = the driver's left
  async_inference: true        # YOLO in its own thread (ORT releases the GIL): inline, yolo26s@640 dropped the driver
                               # face to 20 fps (min 11.6); the boxes are 1-2 frames older, the 3-of-5 vote absorbs it
  lap_pattern:
    min_glances: 3
    window_s: 20
    long_glance_s: 2.0
    conf: 0.40                 # reported confidence for lap_pattern (lower than the detector)
    hands_recent_s: 1.0        # hands seen by the gesture model within this -> no lap pattern

gesture:
  allowed: [Thumb_Up, Thumb_Down, Open_Palm]
  min_score: 0.60
  min_duration_s: 0.5          # a gesture must be held this long

hands:                         # Gesture Recognizer as hand tracker (perception/hands.py): AS9 / AP6, hands for AS7
  num_hands: 2
  min_hand_detection_conf: 0.5
  min_hand_presence_conf: 0.5
  min_tracking_conf: 0.5
  background_hz: 2.0           # outside the dialog window: hand positions (phone geometry, lap pattern), raised hand
  dialog_hz: 0.0               # inside the dialog window: 0 = every frame (Gesture Recognizer ~18 ms p50)
  dropout_ms: 200.0            # a run without the gesture is tolerated this long (recognizer flicker to "None")
  max_gap_s: 0.7               # observations further apart break the hold (background 2 Hz -> 0.5 s period)
  raised_margin: 0.5           # palm above face bottom + 0.5 x face height = raised hand (AS9 outside the window)
  raised_y_frac: 0.6           # no face box: palm above 60 % of the frame height = raised (start)
  raised_boost_s: 2.0          # a raised hand outside the window switches to the dialog rate this long

identity:                      # AS10 / AP1: YuNet + SFace, embeddings per camera profiles/<name>/face_<camera>.npy
  cosine_threshold: 0.363      # OpenCV's recommended SFace value
  yunet_score_threshold: 0.80
  yunet_nms_threshold: 0.30
  enroll_frames: 10
  top_k: 50
  min_face_px: 60.0            # smaller YuNet boxes are ignored
  retry_s: 1.0                 # Face Landmarker sees a face but YuNet did not: retry this soon
  lost_s: 1.0                  # face absent this long -> the next face is a NEW face (identified at once)
  enroll_interval_s: 0.2       # at least this between two enrollment frames (different expressions / poses)
  enroll_min_face_px: 120.0    # enrollment needs a closer face than recognition
  enroll_min_sharpness: 40.0   # variance of the Laplacian on the 112x112 aligned crop (start)
  enroll_min_consistency: 0.5  # every enrolled frame must have cosine >= this to the mean, else the enrollment fails

monitoring:
  face_lost_s: 2.0             # driver face missing longer than this, unexplained -> monitoring_ok=false
  frozen_frame_s: 1.0          # identical frames for this long -> camera frozen
  frozen_pixel_diff: 0.5       # mean absolute pixel difference below this = identical
  dark_luma: 60                # mean frame luma (0-255) below this -> "TOO DARK" warning
  no_frames_s: 1.0             # no frame for this long -> no_frames
  occluded_std_max: 8.0        # luma std below this = uniform image (lens covered) (start, synthetic only)
  blur_var_min: 20.0           # Laplacian variance (160 px wide image) below this = blurred (start, synthetic only)
  covered_s: 1.0               # AS12 / AP5: no face + (luma < covered_luma_max OR uniform OR sharpness <
  covered_luma_max: 30.0       # covered_sharpness_max) this long -> occluded at once (was face_lost_s + 1.5 s = 3.5 s
  covered_sharpness_max: 8.0   # live). A hand passing (< 1 s) does not trigger. Start values: tune in B3
  mono_chroma_max: 2.0         # mean |R-G|,|B-G| below this = monochrome (IR night mode) (start)
  mode_switch_luma_delta: 50.0 # luma jump between consecutive frames, image still structured -> mode_switch (start)
  mode_switch_hold_s: 1.5      # monitoring_ok=false this long after a day/night switch (0 = never)
  analysis_width: 160          # luma / std / blur / chroma measured on a frame resized to this width

demo:                          # demo switches (docs/perception.md "Mod demo"): off = the frame keeps the defaults
  head_answer: true            # AS8 yes / no from the head, both seats (only inside the dialog window)
  posture_driver: true         # driver.posture vs. the calibration reference
  posture_passenger: false     # passenger.posture: not in the scenario, 4 false events / 60 s live (auto reference)
  nodding_triggers: true       # AS4: driver.head.nodding may be true (false: always false)
  rear_seat: true              # AS13: face lost after a large right yaw -> zone rear_seat for at most 3 s

passenger:
  open_reset_frames: 3         # the closed time resets only after this many open frames in a row (one noisy OPEN
                               # frame reset it live: asleep never reached in 16 s on 2026-11-21)
  asleep_closed_s: 8           # AP2: eyes closed this long -> awake = false (target < 10 s); the head is not required
  asleep_closed_head_s: 5      # ... the dropped head is a reinforcer: this long is enough with the head dropped
  head_drop_deg: 15            # pitch this far below the passenger's upright pitch = head dropped
  upright_window_s: 30         # upright pitch = median pitch with the eyes open over the last 30 s

posture:                       # perception/posture.py, both seats; vs. the calibration reference (driver) or the median
                               # of the first auto_ref_s with the face seen. Distances in reference face widths (start)
  auto_ref_s: 10
  forward_width_ratio: 1.20    # face 20 % wider than the reference = head closer to the camera -> leaning_forward
  side_shift_ratio: 0.60       # face centre moved sideways this much ...
  side_roll_deg: 15            # ... or the head rolled this much -> leaning_side
  slumped_drop_ratio: 0.40     # face centre this much lower AND ...
  slumped_pitch_deg: 10        # ... the head pitched down this much -> slumped
  out_shift_ratio: 1.20        # face centre this far away, or ...
  out_width_ratio: [0.60, 1.60] # ... width outside this range (far back / at the camera) -> out_of_position
  min_duration_s: 1.0          # held this long (a mirror check or a quick reach is not a posture)

filters:
  one_euro:                    # default for continuous signals without their own tuning
    min_cutoff: 1.0            # Hz; lower = smoother at rest
    beta: 0.05                 # higher = less lag on fast moves
    d_cutoff: 1.0
  one_euro_head:               # per axis, from scripts/tune_one_euro.py (docs/eval/one-euro-2026-11-21.md):
                               # lowest frame-to-frame jitter with lag <= 50 ms on fast head moves.
                               # Raw noise: yaw 0.10, pitch 0.14, roll 0.18 deg -> 0.05 / 0.06 / 0.15 deg
    yaw:   { min_cutoff: 0.05, beta: 0.01, d_cutoff: 1.0 }
    pitch: { min_cutoff: 0.05, beta: 0.01, d_cutoff: 1.0 }
    roll:  { min_cutoff: 0.5, beta: 0.005, d_cutoff: 1.0 }
  one_euro_gaze:               # MobileGaze yaw / pitch at rates.gaze_hz (raw yaw std 4.3 deg with the head still,
    min_cutoff: 0.5            # laptop session 2026-11-21); starting values, see scripts/eval_zones.py --ab-crop
    beta: 0.02
    d_cutoff: 1.0
  unknown_below_conf: 0.5      # any output below this confidence is reported as unknown

workers:                       # one OS process per camera (docs/perception.md §2)
  modules:                     # extra PipelineModule classes ("package.module:Class") after the built-in ones,
    driver: []                 # constructed as Class(ctx, extractor) (docs/notes/output.md §1)
    passenger: []
  restart_backoff_s: 1.0       # a dead camera process is restarted after 1, 2, 4 ... s
  restart_backoff_max_s: 10.0
  stale_s: 5.0                 # a running process silent this long is hung: kill and restart
  startup_s: 30.0              # before its first frame: DSHOW opens 720p in ~4 s, models load in ~2 s
  first_frame_timeout_s: 10.0   # no first frame by then (and no open error yet) -> camera_unavailable logged
  unavailable_report_s: 5.0    # missing camera: its worker logs camera_unavailable this often and never exits

output:
  ws_url: ws://localhost:8000/ws/perception
  ws_reconnect_s: 1.0          # first retry; doubles up to ws_reconnect_max_s (works without core)
  ws_reconnect_max_s: 10.0
  proposed_fields: true        # also send the fields proposed for the contract (§9); false = strict plan §7
  result_max_age_ms: 1000      # a camera's newest result older than this = no data from that camera (its block keeps
                               # the contract defaults, perf.cameras.<cam>.available = false); above the slowest
                               # degraded passenger rate (2.5 Hz -> 400 ms between results) plus processing
  mjpeg_host: 0.0.0.0          # MJPEG bind address (port: mjpeg_port)
  publish_hz: 15
  mjpeg_port: 8001
  video_width: 640
  video_fps: 12
  jpeg_quality: 70
