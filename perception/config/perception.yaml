# P1 perception thresholds and settings. Validated by perception/config.py (unknown keys are rejected).
# Starting values: tune them on the real setup (Sunday, in the venue). Reasons: docs/perception.md.
# Safety thresholds (when an alarm sounds, microsleep) belong to P2 in core/config/thresholds.yaml, NOT here.

cameras:
  driver:                      # laptop webcam, facing the driver only
    enabled: true
    device: 0                  # OpenCV index (or a path / URL)
    backend: auto              # auto | dshow | msmf | v4l2 | any   (Windows: dshow opens MJPG reliably)
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG               # compressed USB stream -> 720p30 without USB bandwidth issues
    buffer_size: 1             # keep only the latest frame
    reconnect_s: 1.0           # wait between reconnect attempts
    max_read_failures: 15      # consecutive failed reads (~0.5 s at 30 fps) -> reopen the camera
    controls:                  # null = leave as is. Why: docs/perception.md §2.1
      # LAPTOP PROFILE (no lamp): auto exposure + auto white balance, set EXPLICITLY to true because the
      # camera driver remembers manual values after the app exits (a 16 ms manual exposure left the image at
      # mean luma 36/255). VENUE PROFILE (our lamp on the driver): auto_exposure: false, exposure_ms: 16,
      # auto_white_balance: false, white_balance_k: 4600.
      power_line_hz: 50        # EU mains: removes 100 Hz flicker banding under venue lights (Linux only)
      autofocus: false         # no focus hunting when the head moves
      focus: null              # set after checking `camera_setup.sh driver --list` on the real camera
      auto_exposure: true      # venue with lamp: false (auto-exposure "pumping" changes EAR between frames)
      exposure_ms: null        # venue with lamp: 16 (<= 1/fps; limits motion blur)
      gain: null
      auto_white_balance: true # venue with lamp: false
      white_balance_k: null    # venue with lamp: 4600
  passenger:                   # phone via DroidCam over USB, facing the front-right seat only
    enabled: false             # switch on once DroidCam is connected
    device: 1                  # on Windows DroidCam is a virtual webcam index
    backend: auto
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    buffer_size: 1
    reconnect_s: 1.0
    max_read_failures: 15
    controls:                  # DroidCam exposes few controls; leave the phone's auto modes on
      power_line_hz: null
      autofocus: null
      focus: null
      auto_exposure: null
      exposure_ms: null
      gain: null
      auto_white_balance: null
      white_balance_k: null

models:
  dir: perception/models       # relative to the repo root; gitignored, filled by scripts/download_models.sh
  face_landmarker: face_landmarker.task
  gesture_recognizer: gesture_recognizer.task
  gaze: mobileone_s0_gaze.onnx # MobileGaze MobileOne-S0 (yakhyo/gaze-estimation), check the weights' licence
  yunet: face_detection_yunet_2023mar.onnx
  sface: face_recognition_sface_2021dec.onnx
  phone_device: auto           # auto | cpu | gpu   (auto = gpu if CUDA is available)
  phone_cpu: { weights: yolo26n.pt, imgsz: 416 }
  phone_gpu: { weights: yolo26s.pt, imgsz: 640 }
  pose: yolo26n-pose.pt        # only for rear_seat (S feature)
  onnx_providers:              # tried in order, the first available wins (YOLO26s on the GPU)
    - CUDAExecutionProvider
    - OpenVINOExecutionProvider
    - CPUExecutionProvider
  gaze_providers:              # MobileGaze is small: CUDA adds jitter (p95 15.4 vs 8.2 ms, docs/benchmark/)
    - OpenVINOExecutionProvider
    - CPUExecutionProvider

face:                          # MediaPipe Face Landmarker, rules R-FL1..R-FL5 in docs/perception.md
  num_faces: 1                 # R-FL1: one face per camera (internal tracking/smoothing needs it)
  min_detection_conf: 0.5      # R-FL2
  min_presence_conf: 0.5       # R-FL2
  min_tracking_conf: 0.6       # R-FL2
  min_face_width_px: 250       # R-FL3: narrower face -> face_too_small + reduced confidence

rates:
  driver_face_every_frame: true  # the driver face is never degraded
  passenger_face_hz: 10
  gaze_hz: 15
  phone_hz: 5
  pose_hz: 2                   # rear_seat confirmation only
  identity_recheck_s: 10
  perf_window: 120             # samples kept per model for p50/p95
  degrade_e2e_p95_ms: 150      # above this: lower the passenger rate first, then YOLO (driver face: never)
  degrade_step: 0.5            # each step halves the rate being degraded
  degrade_min_passenger_face_hz: 2.5
  degrade_min_phone_hz: 1.25
  degrade_recover_ratio: 0.7   # step back up when p95 < 0.7 x the limit
  degrade_hold_s: 3.0          # at least this long between two steps (no oscillation)

eyes:                          # docs/perception.md §3.2; values from docs/eval/ (diag of 2026-11-21)
  # global reference: calibration, or the p90 of the first seconds. Only a FLOOR for the local reference
  # (the open-eye EAR drifts with head pitch: 0.30 at the start -> 0.24 a minute later in the diag session).
  baseline_window_s: 10
  baseline_percentile: 90
  baseline_min_s: 2.0          # provisional baseline usable after this much valid face time (state UNKNOWN before)
  local_ref_window_s: 4.0      # local reference = p90 of EAR over the last seconds (blinks < 10 % of frames: ignored)
  local_ref_percentile: 90
  local_ref_min_s: 1.0         # below this much open-eye history, the global reference is used
  ref_floor_ratio: 0.60        # local reference never below 0.6 x global (does not collapse with drowsy lids)
  # blink shape, as ratios of the local reference
  drop_ratio: 0.70             # closing: ratio below this ... (0.65 missed shallow blinks: min 0.58-0.63)
  reopen_ratio: 0.80           # ... until it comes back above this
  fall_max_ms: 150             # fast fall (blink / real closure): from the local peak to drop_ratio
  fall_window_s: 1.0           # the local peak = max ratio over this window before the fall
  min_fall_depth: 0.10         # the peak must be at least this far above the threshold (else: a slow drift)
  slow_close_ratio: 0.47       # a SLOW fall counts only below this (2 s closures: 0.42-0.47; a hard squint
                               # hovered at 0.48-0.51). Tuned on ONE session: re-check on every new one
  min_state_frames: 2          # frames below drop_ratio before CLOSED is reported (closed_ms starts at the drop)
  blink_max_ms: 500            # longer than this = closure (separate state), shorter = blink
  plateau_check_ms: 300        # from here on, CLOSED needs ratio < squint band low AND eyeBlink >= blendshape_closed
  blendshape_closed: 0.45      # eyeBlink needed to accept a SLOW fall (drowsy lids); 2 s closures reach ~0.5,
                               # smiles 0.31-0.46, speech 0.26-0.36 in the diag session
  blendshape_strong: 0.65      # eyeBlink alone confirms closed (never reached in the diag session: max 0.59)
  # bilateral rule + gaze conditioning
  unilateral_width_ratio: 0.70 # eye narrower than this x the other (head turned) -> only the wider eye decides
  look_down_threshold: 0.50    # eyeLookDown (mean L/R) at or above this -> relaxed threshold
  pitch_down_deg: 15           # head pitch at or below -this -> relaxed (looking at the lap: -27..-32 deg)
  pitch_up_deg: 20             # head pitch at or above this -> relaxed (EAR drops when the head tilts back)
  drop_ratio_relaxed: 0.45     # closing threshold while relaxed (stricter: the eyes must really close)
  head_motion_window_s: 0.30   # no closure may START while pitch or yaw moved more than head_motion_deg in this
  head_motion_deg: 6.0         # window (the lids follow the head when looking down / at a mirror)
  # R-FL4: squinting / smiling is not closed: ratio inside this band with eyeBlink < blendshape_closed (lids
  # lowered, not meeting). eyeSquint is NOT used: 0.49 at rest and 0.71 with the eyes squeezed shut (diag session).
  squint_ear_band: [0.50, 0.70] # [closed-plateau floor, drop_ratio]: lowered lids that would otherwise be closing
  # PERCLOS P80 (FHWA / Dinges): fraction of time with the eyes >= 80 % closed
  closed_level_default: 0.40   # ratio of a fully closed eye until measured (median of the last blink minima)
  perclos_closure: 0.80
  perclos_window_s: 60
  min_eye_width_px: 18         # eye corner distance below this -> that eye is unreliable

yawn:
  jaw_open_threshold: 0.50     # jawOpen blendshape
  min_duration_s: 1.5

speaking:
  window_s: 1.0
  lip_std_threshold: 0.003     # std of inner-lip gap (13-14) / face height (10-152) over the window. Diag session:
                               # rest p90 0.0007, reading p50 0.0087 (0.008 caught 3/5 sentences, 0.003 caught 5/5)
  reversal_step: 0.003         # smallest gap change counted as a lip movement (fraction of face height)
  min_reversals: 2             # direction changes of the gap per window: speech oscillates, a yawn does not
  hold_ms: 800                 # speaking stays true this long after the last oscillating window (pauses)

head:
  nod:                         # fatigue head drop (with eyes closing)
    pitch_drop_deg: 15
    window_s: 1.5
  answer:                      # yes/no head answer, only while the dialog window is open
    min_reversals: 2
    window_s: 1.2
    min_amplitude_deg: 6
  plausible_deg:               # beyond these the landmarks are garbage (near-profile face: roll 80, yaw -23 while
    yaw: 70                    # the head was turned +50 left, diag 2026-11-21) -> head angles reported as unknown
    pitch: 50
    roll: 45

gaze:
  zones: [road, mirror_left, mirror_right, mirror_rear, cluster, infotainment, lap, passenger]
  k: 5
  weighted: true               # distance-weighted kNN
  reject_distance: 3.0         # mean distance to the k neighbours (z-score units) above this -> unknown
  min_conf: 0.6                # vote share below this -> unknown
  calibration_s_per_zone: 2.0
  calibration_modes: [owl, lizard]  # head turned / eyes only
  vats_max_glance_s: 2.0       # off-road glances shorter than this count for VATS
  window_s: 60                 # VATS and entropy window

phone:
  class_id: 67                 # COCO "cell phone"
  conf_min: 0.40
  vote_window: 5               # last N YOLO runs
  vote_min: 3                  # seen in at least this many -> in use
  near_face_ratio: 1.2         # phone centre within ratio * face width of the face centre -> near_face
  lap_pattern:
    min_glances: 3
    window_s: 20
    long_glance_s: 2.0
    conf: 0.40                 # reported confidence for lap_pattern (lower than the detector)

gesture:
  allowed: [Thumb_Up, Thumb_Down, Open_Palm]
  min_score: 0.60
  min_duration_s: 0.5

identity:
  cosine_threshold: 0.363      # OpenCV's recommended SFace value
  yunet_score_threshold: 0.80
  yunet_nms_threshold: 0.30
  enroll_frames: 10

monitoring:
  face_lost_s: 2.0             # driver face missing longer than this, unexplained -> monitoring_ok=false
  frozen_frame_s: 1.0          # identical frames for this long -> camera frozen
  frozen_pixel_diff: 0.5       # mean absolute pixel difference below this = identical
  dark_luma: 60                # mean frame luma (0-255) below this -> "TOO DARK" warning

passenger:
  asleep_closed_s: 10          # AP2: passenger eyes closed this long -> awake = false

filters:
  one_euro:                    # default for continuous signals without their own tuning
    min_cutoff: 1.0            # Hz; lower = smoother at rest
    beta: 0.05                 # higher = less lag on fast moves
    d_cutoff: 1.0
  one_euro_head:               # per axis, from scripts/tune_one_euro.py (docs/eval/one-euro-2026-11-21.md):
                               # lowest frame-to-frame jitter with lag <= 50 ms on fast head moves.
                               # Raw noise: yaw 0.10, pitch 0.14, roll 0.18 deg -> 0.05 / 0.06 / 0.15 deg
    yaw:   { min_cutoff: 0.05, beta: 0.01, d_cutoff: 1.0 }
    pitch: { min_cutoff: 0.05, beta: 0.01, d_cutoff: 1.0 }
    roll:  { min_cutoff: 0.5, beta: 0.005, d_cutoff: 1.0 }
  unknown_below_conf: 0.5      # any output below this confidence is reported as unknown

workers:                       # one OS process per camera (docs/perception.md §2)
  restart_backoff_s: 1.0       # a dead camera process is restarted after 1, 2, 4 ... s
  restart_backoff_max_s: 10.0
  stale_s: 5.0                 # a live process silent this long is hung: kill and restart
  first_frame_timeout_s: 10.0

output:
  ws_url: ws://localhost:8000/ws/perception
  ws_reconnect_s: 1.0          # first retry; doubles up to ws_reconnect_max_s (works without core)
  ws_reconnect_max_s: 10.0
  proposed_fields: true        # also send the fields proposed for the contract (§9); false = strict plan §7
  publish_hz: 15
  mjpeg_port: 8001
  video_width: 640
  video_fps: 12
  jpeg_quality: 70
