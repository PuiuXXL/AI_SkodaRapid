# P2 fixed texts (plan C5, C10, F6, F8, K2, principle 4). Never written by the LLM.
# Rendered with Python str.format through core/settings.py::render(); the fields of each template are listed above it.
# Phone numbers are never here: only in .env (EMERGENCY_NUMBER, SAFE_CONTACT_NUMBER).

links:
  # Fields: lat, lon
  maps: "https://www.google.com/maps?q={lat:.5f},{lon:.5f}"

sos:                            # C5, F6: driver not responding
  # Twilio <Say> in ro-RO. A link cannot be read aloud: the location goes by SMS and on DriveMate Contact.
  # Fields: driver_name, unresponsive_s, occupants_n, passenger_state_text, time_hhmm
  call: >-
    Alertă automată DriveMate. {driver_name} nu răspunde de {unresponsive_s} secunde.
    Ocupanți: {occupants_n}; pasagerul din dreapta e {passenger_state_text}.
    Locația a fost trimisă prin SMS. Ora: {time_hhmm}.
  # SMS from the driver's phone (send_sms to=emergency) and the red alert on DriveMate Contact.
  # Fields: driver_name, unresponsive_s, occupants_n, passenger_state_text, maps_url, time_hhmm
  sms: >-
    Alertă automată DriveMate. {driver_name} nu răspunde de {unresponsive_s} secunde.
    Ocupanți: {occupants_n}; pasagerul din dreapta e {passenger_state_text}.
    Locație: {maps_url}. Ora: {time_hhmm}.
  # passenger_state_text, from SosReport.passenger_state
  # After a microsleep the driver answered "da": the awake front passenger helps (clip passenger_wake_<p>_<d>).
  # Fields: passenger_name, driver_name
  passenger_wake: "{passenger_name}, te rog, vorbește puțin cu {driver_name}, să rămână treaz."
  passenger_state:
    awake: treaz
    asleep: adormit
    absent: absent
  # Spoken to the passenger when the countdown starts (clip passenger_instructions_<passenger>_<driver> when it
  # exists, TTS otherwise). Never "apucă volanul". Fields: passenger_name, driver_name
  passenger_instructions: "{passenger_name}, {driver_name} nu răspunde. Pornește avariile. Rămâi pe linie, chem ajutor."
  # The second "Ești bine?": the eyes opened but no answer came (TTS). Fields: driver_name
  reask: "{driver_name}, mă auzi? Spune da sau dă din cap."

drowsiness:                     # C3, C4: a closure that ended before the alarm (core/safety/drowsiness.py), no LLM
  # One yes / no question: "da" = the break. At most 15 words. Fields: driver_name
  checkin: "{driver_name}, ai închis ochii câteva clipe. Facem o pauză?"
  # After "Ești bine?" was answered (the SOS was cancelled). Fields: driver_name
  checkin_after_sos: "{driver_name}, facem o pauză?"
  # The same with what happened (2026-11-22: personal, not canned), when the car is moving. Fields: driver_name, s
  # (seconds with a comma), speed_kmh; with a stop ahead also poi_name, dist_km. *_nodding: the head fell.
  checkin_after_sos_context: "{driver_name}, ai închis ochii {s} secunde la {speed_kmh} km/h. Facem o pauză?"
  checkin_after_sos_stop: "{driver_name}, ai închis ochii {s} secunde la {speed_kmh} km/h. {poi_name} e la {dist_km} km. Oprim acolo?"
  checkin_after_sos_nodding: "{driver_name}, ți-a căzut capul la {speed_kmh} km/h. Facem o pauză?"
  checkin_after_sos_nodding_stop: "{driver_name}, ți-a căzut capul la {speed_kmh} km/h. {poi_name} e la {dist_km} km. Oprim acolo?"
  # Yes, with the nearest stop ahead (core.reminders.pick_stop). Fields: poi_name, dist_km
  break_stop: "Bine. Cea mai apropiată oprire e {poi_name}, la {dist_km} km."
  break_no_stop: "Bine. Oprește când poți, în siguranță."
  declined: "Bine. Sunt aici dacă ai nevoie."

safe_contact:                   # C10, F8: tired driver who refused the assistant
  # SMS from the driver's phone (send_sms to=safe_contact) and the yellow notice on DriveMate Contact.
  # Fields: driver_name, elapsed_text, maps_url, eta_min
  sms: >-
    DriveMate: {driver_name} pare obosit ({elapsed_text} la volan) și nu vrea pauză acum.
    Scrie-i un mesaj (i-l citesc cu voce tare) sau sună-l.
    Locație: {maps_url}. Ajunge în ~{eta_min} min.
  # The same without an ETA (no destination). Fields: driver_name, elapsed_text, maps_url
  sms_no_eta: >-
    DriveMate: {driver_name} pare obosit ({elapsed_text} la volan) și nu vrea pauză acum.
    Scrie-i un mesaj (i-l citesc cu voce tare) sau sună-l.
    Locație: {maps_url}.
  # Said to the driver after "Ok, te las în pace." when announce = true (principle 9: nothing behind the driver's
  # back). Clip notify_contact_<contact>. Fields: contact_name
  announce: "Îi dau de veste lui {contact_name}."
  # elapsed_text. Fields: h, m
  elapsed_hours: "{h} h {m} min"
  elapsed_minutes: "{m} min"

reminders:                      # K2: delivered only with the car stopped at a POI of the category
  # Fields: task (the noun phrase of create_reminder, e.g. "lichid de parbriz"; several joined with " și ")
  due: "Ai zis să iei {task}."
  kept: "Bine, ți-l amintesc la următoarea oprire."

explanations:                   # principle 4, D5: one sentence per alert, in the event log and for alert_explain
  # Fields: s (seconds, one decimal with a comma, e.g. "2,1"), speed_kmh, zone_text, reason_text
  microsleep: "Ochii închiși {s} s la {speed_kmh} km/h."
  nodding: "Capul a căzut la {speed_kmh} km/h."
  head_down: "Capul a coborât și fața nu s-a mai văzut, la {speed_kmh} km/h."
  face_lost: "Fața nu s-a mai văzut {s} s, la {speed_kmh} km/h."
  off_road: "Ai privit {zone_text} {s} s la {speed_kmh} km/h."
  phone: "Telefon în mână {s} s la {speed_kmh} km/h."
  unresponsive: "Nu ai răspuns {s} s după alarmă."
  monitoring_lost: "Camera nu te mai vede: {reason_text}."

# Pre-generated clips (P3: integrations/audio_clips.py, dashboard/public/sounds/clips/clips.json), played by the voice.
# Names are profile names (occupants[].profile), lower case.
clips:
  url: "/sounds/clips/{clip_id}.mp3"
  alarm: "alarm_{driver}"                                   # "ANDREI!" (fallback of the two below)
  alarm_alert: "alarm_{alert}_{n}_{driver}"                 # "ANDREI! Trezește-te!" (variants n = 1, 2, ...)
  alarm_repeat: "alarm_repeat_{alert}_{driver}"             # "ANDREI! A doua oară! Hai să oprim."
  # Alerts that use another alert's clips (the head falling is a microsleep for the driver).
  alarm_aliases: {nodding: microsleep, eyes_closing: microsleep, head_down: microsleep, face_lost: unresponsive}
  passenger_wake: "passenger_wake_{passenger}_{driver}"     # "Maria, te rog, vorbește puțin cu Andrei..."
  are_you_ok: "are_you_ok"                                  # "Ești bine?"
  passenger_instructions: "passenger_instructions_{passenger}_{driver}"   # "Maria, Andrei nu răspunde. ..."
  monitoring_lost: "monitoring_lost"                        # "Nu te mai văd. Monitorizarea e întreruptă."
  confirm_ok: "confirm_ok"                                  # "Ok."
  confirm_done: "confirm_done"                              # "Gata." (K2: reminder done)
  message_deferred: "message_deferred"                      # "Ți-l citesc imediat ce e liniște." (F2)
  notify_contact: "notify_contact_{contact}"                # "Îi dau de veste lui Mihai." (C10)
  # C2 voice stage. These clips do not exist yet: the text goes through P3's TTS until P3 generates them.
  eyes_on_road: "eyes_on_road"                              # escalation.off_road
  phone_down: "phone_down"                                  # escalation.phone
  phone_read_for_you: "phone_read_for_you"                  # escalation.phone_message
  default_driver: "andrei"      # while P1 does not recognise the driver yet (occupants[].profile = null)
  default_passenger: "maria"

# C2: the voice stage of a P2 distraction (fixed texts, no LLM; the alarm comes after if it goes on).
# Fields: driver_name
escalation:
  off_road: "{driver_name}, fii atent la drum, te rog."
  phone: "{driver_name}, lasă telefonul, te rog."
  phone_message: "{driver_name}, lasă telefonul, ți-l citesc eu."   # a message is waiting (scene 3)
  # Before the assistant's sentence stopped by the warning, said again once the driver looks back (assistant.resume_*)
  resume_prefix: "Cum ziceam,"
# More ways to say the same warning, used in turn after the first one (so it does not sound canned). Fields: driver_name
escalation_variants:
  off_road: ["{driver_name}, privirea pe drum, te rog.", "{driver_name}, revino cu ochii pe drum."]
  phone: ["{driver_name}, telefonul jos, te rog.", "{driver_name}, pune telefonul deoparte."]
  phone_message: ["{driver_name}, nu-l citi tu, ți-l citesc eu."]
# The same warning again within safety.escalation.repeat_window_min: firmer, with the next step. Fields: driver_name
escalation_repeat:
  off_road: "{driver_name}, din nou te-ai uitat în altă parte. Privirea pe drum, te rog."
  phone: "{driver_name}, iar telefonul. Lasă-l jos; ce e urgent îți citesc eu."
  phone_message: "{driver_name}, lasă telefonul, ți-l citesc eu."

# B4: the cause of the distraction, for the event log. Fields: glances (in cause.window_s)
causes:
  passenger_showing_phone: "Cauză: pasagerul îi arată ceva pe telefon ({glances} priviri spre dreapta)."
  passenger_talk: "Cauză: discuția cu pasagerul ({glances} priviri spre dreapta)."
  incoming_message: "Cauză: un mesaj nou pe telefon."
  phone: "Cauză: telefonul în mână."
  child_activity: "Cauză: copilul din spate ({glances} priviri în spate)."

# D2, D6: the measured effect of an intervention ("efectul măsurat în această sesiune"). Fields: pct
interventions:
  delegate_ok: "Cauză rezolvată ✓ (+{pct}%): privirile spre pasager au scăzut."
  delegate_no: "Remediul nu a ajutat: privirile spre pasager nu au scăzut. Se renunță la el."
  music_ok: "Muzica a ajutat: dezinteresul a scăzut cu {pct}%."
  music_no: "Muzica nu a scăzut dezinteresul."

# B8: what the simple threshold "saw", for the event log next to the A/B counter.
naive:
  head_pose: "Prag simplu: capul întors peste prag."
  eyes_closed: "Prag simplu: ochi închiși."
  phone: "Prag simplu: telefon în cadru."

# Deterministic yes / no for "Ești bine?" (C4): no LLM on the safety path. Compared after lower case, without
# diacritics and punctuation; the phrase that starts first in the sentence wins ("da, nu-i nimic" = yes).
answers:
  "yes": ["da", "sunt bine", "e bine", "bine", "ok", "okay", "sunt ok", "sunt treaz", "totul e bine", "nicio problema"]
  "no": ["nu", "nu sunt bine", "nu e bine", "nu ma simt bine", "ajutor", "rau"]

# The answer to "Ești bine?" (C4, core/safety/answers.py::parse_sos_voice). Same matching as `answers`, three groups:
# a reassuring negation is a yes ("nu-i nimic", "nu mi-e rău"); only a clear "no" starts the countdown at once; a bare
# "nu" is unclear: the question is asked once more. "Nu, sunt bine." (with the comma) is a yes; without punctuation
# "nu sunt bine" is a no (safety first: the browser's STT rarely writes the comma).
sos_answers:
  "yes": ["da", "sunt bine", "e bine", "bine", "ok", "okay", "sunt ok", "sunt treaz", "totul e bine", "nicio problema",
          "nu i nimic", "nu e nimic", "n am nimic", "nu am nimic", "nu mi e rau", "nu ti face griji",
          "nu va faceti griji", "nu te ingrijora", "nu i problema", "nu e problema"]
  "no": ["nu sunt bine", "nu e bine", "nu ma simt bine", "mi e rau", "ma simt rau", "rau", "ajutor", "ajuta ma",
         "nu pot", "ma doare"]
  "unclear": ["nu"]

# zone_text for explanations.off_road, by driver.gaze.zone
zones:
  lap: "în jos"
  passenger: "spre pasager"
  infotainment: "spre ecran"
  cluster: "spre bord"
  rear_seat: "în spate"
  away: "în altă parte"
  mirror_left: "în oglinda stângă"
  mirror_right: "în oglinda dreaptă"
  mirror_rear: "în retrovizor"

# reason_text for explanations.monitoring_lost, by driver.monitoring_reason (both P1 vocabularies)
monitoring_reasons:
  occluded: "camera e acoperită"
  camera_covered: "camera e acoperită"
  face_lost: "fața nu se mai vede"
  too_dark: "e prea întuneric"
  blurred: "imaginea e neclară"
  frozen: "imaginea e înghețată"
  camera_frozen: "imaginea e înghețată"
  no_frames: "camera nu mai trimite imagini"
  camera_unavailable: "camera nu mai trimite imagini"
  mode_switch: "camera își schimbă modul"
  unknown: "motiv necunoscut"
